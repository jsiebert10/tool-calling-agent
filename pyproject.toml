[project]
name = "cadence-running-agent"
version = "0.1.0"
description = "Cadence: a running coach agent (FastAPI + LiteLLM + Gemini) that plans runs around your schedule and the weather, finds safe routes, and builds BPM-matched playlists"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "tzdata>=2026.5",
]
